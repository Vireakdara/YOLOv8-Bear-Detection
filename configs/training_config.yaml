# YOLO Training Configuration for Bear Detection

model_name: 'yolov8x.pt'  # YOLOv8 Extra-Large model for better accuracy
img_size: 640  # input image size
epochs: 100
batch_size: 16
patience: 20  # EarlyStopping patience
device: 0  # GPU device index (0 for first GPU)

# Augmentation settings for challenging conditions
augment: true
mosaic: 1.0
mixup: 0.1
copy_paste: 0.1
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.5
fliplr: 0.5
bgr: 0.0

# Optimizer settings
optimizer: 'SGD'
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# Loss function weights
cls: 0.5
dfl: 1.5

# Detection parameters
iou_threshold: 0.45
conf_threshold: 0.25

# Strategy
resume: false  # resume from checkpoint
save_period: 10  # save checkpoint every N epochs
save: true
exist_ok: false
verbose: true
workers: 8

# Directories
project: './results'
name: 'bear_detection_yolov8x'
